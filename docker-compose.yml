# Development stack untuk NodePanel.
# Production tidak memakai compose ini — lihat docs/INSTALL.md.
services:
  mysql:
    image: mysql:8.4
    container_name: nodepanel-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root-dev-only
      MYSQL_DATABASE: nodepanel
      MYSQL_USER: nodepanel
      MYSQL_PASSWORD: nodepanel-dev
    ports:
      - "3306:3306"
    volumes:
      - nodepanel-mysql:/var/lib/mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pnodepanel-dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: nodepanel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - nodepanel-redis:/data

volumes:
  nodepanel-mysql:
  nodepanel-redis:
